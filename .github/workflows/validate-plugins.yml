name: validate-plugins

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate marketplace.json and version invariant
        run: |
          node --input-type=module -e '
          import { readFileSync } from "node:fs";
          const m = JSON.parse(readFileSync(".claude-plugin/marketplace.json", "utf8"));
          for (const k of ["name", "owner", "plugins"]) if (!(k in m)) throw new Error(`marketplace: missing ${k}`);
          for (const p of m.plugins) {
            for (const k of ["name", "source", "description", "version"]) if (!(k in p)) throw new Error(`${p.name}: missing ${k}`);
            if (!/^\d+\.\d+\.\d+$/.test(p.version)) throw new Error(`${p.name}: version ${p.version} is not semver`);
            const own = JSON.parse(readFileSync(`${p.source}/.claude-plugin/plugin.json`, "utf8"));
            if (own.version !== p.version) throw new Error(`${p.name}: marketplace ${p.version} != plugin.json ${own.version}`);
          }
          console.log(`OK: ${m.plugins.length} plugin(s), versions in sync`);
          '

  plugin-validate:
    runs-on: ubuntu-latest
    needs: static-validate
    strategy:
      matrix:
        plugin: [chessboost-toolkit]
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s stable
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate plugin (no auth)
        run: claude plugin validate ./plugins/${{ matrix.plugin }}
      - name: Hook tests
        run: node ./plugins/${{ matrix.plugin }}/hooks/tests/run.mjs
